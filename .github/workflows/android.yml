name: Android CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/pro-audio-studio, feature/android-audio-focus-mode, fix/analog-focused-visualizer-and-cold-start-playback ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package has been removed from Google's SDK repo.
          # Explicitly install only current SDK packages.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run audio core regression tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build optimised release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Analog-release
          path: app/build/outputs/apk/release/*.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Analog-debug
          path: app/build/outputs/apk/debug/*.apk
